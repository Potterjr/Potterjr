<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="hooktrans: Japanese game dialogue translated to Thai in a floating overlay">
<title>hooktrans: Japanese game dialogue translated to Thai in a floating overlay</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF0FF"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0369A1"/><stop offset="1" stop-color="#6A3DF5"/></linearGradient>
<linearGradient id="accentD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#8B6CFF"/></linearGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#0369A1" stop-opacity="0.14"/><stop offset="1" stop-color="#0369A1" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#6A3DF5" stop-opacity="0.16"/><stop offset="1" stop-color="#6A3DF5" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0B1228" fill-opacity="0.07"/></pattern>
<radialGradient id="fade" cx="0.7" cy="0.45" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gridMask"><rect width="600" height="300" fill="url(#fade)"/></mask>
<clipPath id="frame"><rect width="600" height="300" rx="20"/></clipPath>
<clipPath id="scene"><rect x="60" y="34" width="480" height="232" rx="14"/></clipPath><clipPath id="dlg"><rect x="84" y="150" width="432" height="42" rx="8"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1B6B"/><stop offset="1" stop-color="#0B1030"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.jp{opacity:0;animation:jp 10s linear infinite}.th{opacity:0;animation:th 10s linear infinite}.pB{animation-delay:-5s}@keyframes jp{0%{opacity:0}3%,46%{opacity:1}50%,100%{opacity:0}}@keyframes th{0%,9%{opacity:0;transform:translateY(5px)}13%,46%{opacity:1;transform:translateY(0)}50%,100%{opacity:0;transform:translateY(0)}}.sweep{animation:sweep 5s linear infinite}@keyframes sweep{0%,2%{transform:translateX(0)}16%,100%{transform:translateX(500px)}}.ld{opacity:0;animation:ld 5s linear infinite}@keyframes ld{0%,3%{opacity:0}5%,17%{opacity:1}19%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.jp,.th{opacity:1}.pB{opacity:0}}
</style>
<g clip-path="url(#frame)">
<rect width="600" height="300" fill="url(#bg)"/>
<circle cx="120" cy="40" r="220" fill="url(#glowB)"/><circle cx="520" cy="290" r="220" fill="url(#glowA)"/>
<rect width="600" height="300" fill="url(#dots)" mask="url(#gridMask)"/>

<g clip-path="url(#scene)">
<rect x="60" y="34" width="480" height="232" fill="url(#sky)"/>
<circle cx="96" cy="62" r="1.4" fill="#fff" fill-opacity=".7"/><circle cx="150" cy="96" r="1" fill="#fff" fill-opacity=".7"/><circle cx="214" cy="58" r="1.6" fill="#fff" fill-opacity=".7"/><circle cx="286" cy="84" r="1" fill="#fff" fill-opacity=".7"/><circle cx="338" cy="54" r="1.3" fill="#fff" fill-opacity=".7"/><circle cx="392" cy="104" r="1" fill="#fff" fill-opacity=".7"/><circle cx="506" cy="132" r="1.2" fill="#fff" fill-opacity=".7"/><circle cx="520" cy="60" r="1" fill="#fff" fill-opacity=".7"/>
<circle cx="452" cy="86" r="24" fill="#FFE9A8"/><circle cx="463" cy="79" r="22" fill="#281A66"/>
<path d="M60 176Q140 112 230 160T400 150T540 170V266H60Z" fill="#1A1250"/>
<path d="M60 206Q180 156 300 198T540 190V266H60Z" fill="#100B36"/>
</g>
<rect x="60.5" y="34.5" width="479" height="231" rx="13.5" fill="none" stroke="#2B3558"/>
<rect x="84" y="150" width="432" height="42" rx="8" fill="#05070F" fill-opacity=".66" stroke="#fff" stroke-opacity=".22"/>
<g clip-path="url(#dlg)"><rect class="sweep" x="24" y="150" width="60" height="42" fill="url(#shine)"/></g>
<text class="sans jp" x="100" y="177" font-size="17" fill="#fff">こんにちは、旅人さん。</text>
<text class="sans jp pB" x="100" y="177" font-size="17" fill="#fff">ここは危険だ、気をつけて。</text>
<rect x="84" y="202" width="432" height="44" rx="10" fill="#0D1432" fill-opacity=".95" stroke="url(#accentD)" stroke-width="1.5"/>
<rect x="94" y="212" width="36" height="24" rx="7" fill="url(#accentD)"/>
<text class="mono" x="112" y="228.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">TH</text>
<g class="ld" fill="#8E9BC2"><circle cx="148" cy="224" r="3"/><circle cx="160" cy="224" r="3"/><circle cx="172" cy="224" r="3"/></g>
<text class="sans th" x="142" y="230" font-size="17" font-weight="600" fill="#fff">สวัสดี นักเดินทาง</text>
<text class="sans th pB" x="142" y="230" font-size="17" font-weight="600" fill="#fff">ที่นี่อันตราย ระวังตัวด้วย</text>

</g>
<rect x=".5" y=".5" width="599" height="299" rx="19.5" fill="none" stroke="#D3DBF0"/>
</svg>
