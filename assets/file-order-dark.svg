<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="file-order: files in a sidebar tree reordered by priority number">
<title>file-order: files in a sidebar tree reordered by priority number</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#121A3C"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#8B6CFF"/></linearGradient>
<linearGradient id="accentD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#8B6CFF"/></linearGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#4FC3F7" stop-opacity="0.26"/><stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#8B6CFF" stop-opacity="0.34"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/></pattern>
<radialGradient id="fade" cx="0.5" cy="0.5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gridMask"><rect width="600" height="300" fill="url(#fade)"/></mask>
<clipPath id="frame"><rect width="600" height="300" rx="20"/></clipPath>

</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.up{animation:up 6s cubic-bezier(.65,0,.35,1) infinite}.down{animation:down 6s cubic-bezier(.65,0,.35,1) infinite}@keyframes up{0%,22%{transform:translateY(0)}34%,72%{transform:translateY(-38px)}84%,100%{transform:translateY(0)}}@keyframes down{0%,22%{transform:translateY(0)}34%,72%{transform:translateY(38px)}84%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="600" height="300" fill="url(#bg)"/>
<circle cx="80" cy="60" r="230" fill="url(#glowA)"/><circle cx="540" cy="260" r="230" fill="url(#glowB)"/>
<rect width="600" height="300" fill="url(#dots)" mask="url(#gridMask)"/>

