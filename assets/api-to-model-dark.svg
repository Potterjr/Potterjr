<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="api-to-model: a cURL response turning into a Dart model class">
<title>api-to-model: a cURL response turning into a Dart model class</title>
<defs>
