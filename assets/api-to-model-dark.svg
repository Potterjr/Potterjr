<path d="M328 70.5H574" stroke="#2A3566"/>
<g class="out"><text class="mono l0" x="346.0" y="98" font-size="13"><tspan fill="#8B6CFF">class</tspan><tspan fill="#4FC3F7"> User </tspan><tspan fill="#93A0C8">{</tspan></text><text class="mono l1" x="361.6" y="120" font-size="13"><tspan fill="#8B6CFF">final</tspan><tspan fill="#4FC3F7"> int</tspan><tspan fill="#F4F7FF"> id</tspan><tspan fill="#93A0C8">;</tspan></text><text class="mono l2" x="361.6" y="142" font-size="13"><tspan fill="#8B6CFF">final</tspan><tspan fill="#4FC3F7"> String</tspan><tspan fill="#F4F7FF"> name</tspan><tspan fill="#93A0C8">;</tspan></text><text class="mono l3" x="361.6" y="164" font-size="13"><tspan fill="#8B6CFF">final</tspan><tspan fill="#4FC3F7"> bool</tspan><tspan fill="#F4F7FF"> active</tspan><tspan fill="#93A0C8">;</tspan></text><text class="mono l4" x="346.0" y="186" font-size="13"><tspan fill="#93A0C8">}</tspan></text></g>
<rect x="344" y="222" width="46.4" height="24" rx="12" fill="#141C45" stroke="#2A3566"/><text class="mono" x="367.2" y="238" font-size="11" text-anchor="middle" fill="#93A0C8">Copy</text><rect x="398.4" y="222" width="59.6" height="24" rx="12" fill="#141C45" stroke="#2A3566"/><text class="mono" x="428.2" y="238" font-size="11" text-anchor="middle" fill="#93A0C8">Insert</text><rect x="466.0" y="222" width="46.4" height="24" rx="12" fill="#141C45" stroke="#2A3566"/><text class="mono" x="489.2" y="238" font-size="11" text-anchor="middle" fill="#93A0C8">Save</text>

