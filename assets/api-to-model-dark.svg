<rect width="600" height="300" fill="url(#bg)"/>
<circle cx="300" cy="150" r="230" fill="url(#glowB)"/><circle cx="60" cy="300" r="180" fill="url(#glowA)"/>
<rect width="600" height="300" fill="url(#dots)" mask="url(#gridMask)"/>

<rect x="26" y="36" width="246" height="228" rx="12" fill="#0D1432" stroke="#2A3566"/>
